AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  Rotation Lambda for adserve/database-url (adserve_app role).
  Wraps the AWS-published SecretsManagerRDSPostgreSQLRotationSingleUser
  SAR app, deployed into the adserve VPC with egress to RDS via
  adserve-rotation-lambda-sg.

Parameters:
  endpoint:
    Type: String
    Default: https://secretsmanager.eu-west-2.amazonaws.com
  functionName:
    Type: String
    Default: adserve-rotate-app-secret
  vpcSubnetIds:
    Type: CommaDelimitedList
    Default: "subnet-08907b065b8d35b83,subnet-070cbe70f61dc16e5"
  vpcSecurityGroupIds:
    Type: CommaDelimitedList
    # adserve-rotation-lambda-sg — egress to RDS SG sg-012023b2c91d23bde
    Default: "sg-00ab19854e010ad61"
  excludeCharacters:
    Type: String
    # Characters that break URLs or shell escaping in DATABASE_URL contexts.
    # Secrets Manager's GetRandomPassword respects this exclusion list.
    Default: "\"@/\\'"

Resources:
  AppSecretRotation:
    Type: AWS::Serverless::Application
    Properties:
      Location:
        ApplicationId: arn:aws:serverlessrepo:us-east-1:297356227824:applications/SecretsManagerRDSPostgreSQLRotationSingleUser
        SemanticVersion: 1.1.672
      Parameters:
        endpoint: !Ref endpoint
        functionName: !Ref functionName
        vpcSubnetIds: !Join [",", !Ref vpcSubnetIds]
        vpcSecurityGroupIds: !Join [",", !Ref vpcSecurityGroupIds]
        excludeCharacters: !Ref excludeCharacters

Outputs:
  RotationLambdaARN:
    Description: ARN of the rotation Lambda — pass to `secretsmanager rotate-secret --rotation-lambda-arn`
    # The SAR nested stack exports the Lambda ARN as RotationLambdaARN.
    Value: !GetAtt AppSecretRotation.Outputs.RotationLambdaARN
